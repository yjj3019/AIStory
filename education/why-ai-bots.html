      '그래서 우리는 지금 도입보다 위임 설계를 익힙니다. 체크리스트는 저위험 위임, 최소 권한, 승인 게이트, 로그, 국내 출시와 규제 확인 후 도입 검토입니다. 기억할 세 줄입니다. 시작은 답만 주는 한계, 진행은 오픈소스와 에이전트 소셜을 거쳐 클라우드로, 현재는 격리와 승인, 위임 단위 연습이 먼저입니다. Galaxy는 이천이십육년 구월 십오일에서 십칠일 일정만 말합니다.'
    ]
  }
];

const AUDIO_DIR = 'audio/';
const sceneCount = SCENES.length; // 20 → ending id = 21-ending

function clipName(idx) {
  // idx: 0=opening, 1..N=scenes, N+1=ending
  if (idx === 0) return '00-opening';
  if (idx === sceneCount + 1) return String(sceneCount + 1).padStart(2, '0') + '-ending';
  return String(idx).padStart(2, '0') + '-scene';
}

const story = document.getElementById('story');
const closing = document.getElementById('closing');
const player = document.getElementById('player');
const meta = document.getElementById('meta');
const engineEl = document.getElementById('engine');
let idx = 0; // 0 opening spoken before scenes; pages map to 1..N
let audio = null;
let speaking = false;

function buildPages() {
  SCENES.forEach((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'page';
    sec.id = 'scene-' + (i + 1);
    sec.innerHTML = '<div class="year"></div><h2></h2><div class="lines"></div>';
    sec.querySelector('.year').textContent = s.year;
    sec.querySelector('h2').textContent = s.title;
    const lines = sec.querySelector('.lines');
    (s.lines || []).forEach((t, li) => {
      const p = document.createElement('p');
      p.textContent = t;
      if (li === 0) p.classList.add('active');
      lines.appendChild(p);
    });
    story.appendChild(sec);
  });
  closing.querySelector('.quote').textContent = ENDING_TEXT;
}

function showScene(n) {
  // n: 1..sceneCount for scenes; sceneCount+1 closing
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  closing.classList.remove('show');
  if (n >= 1 && n <= sceneCount) {
    const el = document.getElementById('scene-' + n);
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    meta.textContent = (n) + ' / ' + sceneCount + ' · ' + (SCENES[n - 1].year || '');
  } else if (n === sceneCount + 1) {
    closing.classList.add('show');
    meta.textContent = '엔딩';
  }
}

function stopAudio() {
  if (audio) { audio.pause(); audio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
  document.getElementById('play').textContent = '▶';
}

function getClip(id) {
  return new Promise((resolve) => {
    const a = new Audio();
    let settled = false;
    const done = (ok) => { if (!settled) { settled = true; resolve(ok ? a : null); } };
    a.preload = 'auto';
    a.addEventListener('canplaythrough', () => done(true), { once: true });
    a.addEventListener('error', () => done(false), { once: true });
    a.src = AUDIO_DIR + id + '.mp3';
    setTimeout(() => done(false), 800);
  });
}

async function speakText(id, text, onDone) {
  stopAudio();
  speaking = true;
  document.getElementById('play').textContent = '❚❚';
  const clip = await getClip(id);
  if (clip) {
    engineEl.textContent = '고품질 음성';
    audio = clip;
    audio.onended = () => { speaking = false; document.getElementById('play').textContent = '▶'; onDone && onDone(); };
    audio.play().catch(() => browserTTS(text, onDone));
  } else {
    engineEl.textContent = '브라우저 음성';
    browserTTS(text, onDone);
  }
}

function browserTTS(text, onDone) {
  if (!window.speechSynthesis) { onDone && onDone(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.onend = () => { speaking = false; document.getElementById('play').textContent = '▶'; onDone && onDone(); };
  speechSynthesis.speak(u);
}

function afterOpening() {
  story.hidden = false;
  player.hidden = false;
  idx = 1;
  showScene(1);
  playCurrent();
}

function playCurrent() {
  if (idx === 0) {
    speakText('00-opening', OPENING_TEXT, afterOpening);
    return;
  }
  if (idx >= 1 && idx <= sceneCount) {
    const s = SCENES[idx - 1];
    showScene(idx);
    speakText(clipName(idx), (s.lines || []).join(' '), () => {
      idx += 1;
      if (idx <= sceneCount) playCurrent();
      else playEnding();
    });
    return;
  }
  playEnding();
}

function playEnding() {
  idx = sceneCount + 1;
  showScene(idx);
  speakText(clipName(idx), ENDING_TEXT, () => {});
}

document.getElementById('start').addEventListener('click', () => {
  document.getElementById('intro').style.display = 'none';
  idx = 0;
  player.hidden = false;
  meta.textContent = '오프닝';
  playCurrent();
});

document.getElementById('play').addEventListener('click', () => {
  if (speaking) { stopAudio(); return; }
  playCurrent();
});
document.getElementById('prev').addEventListener('click', () => {
  stopAudio();
  if (idx <= 1) { idx = 1; showScene(1); return; }
  idx -= 1;
  showScene(idx);
});
document.getElementById('next').addEventListener('click', () => {
  stopAudio();
  if (idx < sceneCount + 1) { idx += 1; showScene(idx); }
});

buildPages();
</script>
</body>
</html>
