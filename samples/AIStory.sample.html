<!--
  AIStory HTML의 SCENES 배열 구조를 보여주는 축소 샘플입니다.
  교육 트랙 실콘텐츠는 education/why-ai-bots.html (커밋됨)을 참고하세요.
  루트 AIStory.html 은 .gitignore 대상이라 저장소에 없을 수 있습니다.
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIStory 구조 샘플</title>
</head>
<body>

<!-- 오프닝/엔딩은 SCENES 순회 루프에 흡수하지 않고 start()/afterScene()에서 명시적으로 재생한다 -->
<script>
const OPENING_TEXT = '(예시) 오프닝 문구. extract_narration.py가 HTML의 OPENING_TEXT를 우선 파싱하고, 없으면 모듈 상수를 쓴다.';
const ENDING_TEXT = '(예시) 엔딩 문구. 엔딩 id는 장면 수 N에 대해 (N+1)-ending 으로 동적 부여된다.';

// 인물/조직 데이터는 교육 트랙에서는 비워도 된다 (로고·스크린샷 없음).
const P = {};
const ORG = {};

// N장 서사 본문 — 각 장은 {year, bg, title, who[], contextImg?, lines[]} 형태
const SCENES = [
  {
    year: '1장 · (예시) 표지',
    bg: '#0F1330',
    title: '(예시) 장면 제목',
    who: [],
    lines: [
      '(예시) 문단 1 — extract_narration.py가 이 배열을 그대로 narration.json의 lines[]로 추출한다.',
      '(예시) 문단 2.'
    ]
  }
  // ... 나머지 장면 반복. 교육 트랙은 20장 → 엔딩 id 21-ending.
];

const sceneCount = SCENES.length;

// audio/<id>.mp3|wav 가 있으면 사용, 없으면 브라우저 내장 TTS로 자동 폴백
function clipName(idx) {
  // idx: 0=opening, 1..N=scenes, N+1=ending
  if (idx === 0) return '00-opening';
  if (idx === sceneCount + 1) return String(sceneCount + 1).padStart(2, '0') + '-ending';
  return String(idx).padStart(2, '0') + '-scene';
}
</script>

</body>
</html>
